name: Update Lairen cards database

on:
  schedule:
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cards:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download and validate Lairen database
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          url = "https://lairentcg.com.ar:8443/api/carta/cartas/ordenadas"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Lairen-Artist-Archive-Updater/1.0"}
          )

          with urllib.request.urlopen(request, timeout=60) as response:
              if response.status != 200:
                  raise RuntimeError(f"API returned HTTP {response.status}")
              raw_data = response.read()

          cards = json.loads(raw_data)
          if not isinstance(cards, list) or len(cards) < 100:
              raise RuntimeError("API response is not a valid full card list")

          required_fields = {"idCarta", "nombreCarta"}
          if not all(
              isinstance(card, dict) and required_fields.issubset(card)
              for card in cards[:20]
          ):
              raise RuntimeError("API response is missing expected card fields")

          if not any(isinstance(card, dict) and "artista" in card for card in cards):
              raise RuntimeError("API response does not contain artist data")

          output = Path("data/cards.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_bytes(raw_data)
          print(f"Validated and saved {len(cards)} cards.")
          PY

      - name: Commit database if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/cards.json; then
            echo "The database is already up to date."
          else
            git add data/cards.json
            git commit -m "Automatically update Lairen cards database"
            git push
          fi
