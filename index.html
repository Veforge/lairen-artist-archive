<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lairen Artist Archive</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="hero">

    <div class="hero-content">

        <h1>Lairen Artist Archive</h1>

        <p>
            Descubrí a los ilustradores que dan vida al universo de Lairen: la Historia.
        </p>

        <div class="hero-actions">

            <input
                type="text"
                id="searchInput"
                placeholder="Buscar ilustrador..."
            >

            <button id="shuffleButton">
                🎲 Cambiar portadas
            </button>

        </div>

        <section id="stats">

            <div class="stat">
                <strong id="artistCount">0</strong>
                <span>Artistas</span>
            </div>

            <div class="stat">
                <strong id="cardCount">0</strong>
                <span>cartas Ilustradas</span>
            </div>

        </section>

    </div>

</header>

<main>

    <section id="artistList"></section>

    <section id="artistDetail">
        <h2>Seleccioná un artista</h2>
    </section>

</main>

<div id="imageModal" class="modal hidden">

    <span id="closeModal">&times;</span>

    <img id="modalImage" src="" alt="">

</div>

<script src="js/script.js"></script>

</body>
</html>
